<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Merge</title>
<style>
  body {
    background: #0e101f;
    color: #e7eaf5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    color: #ffffff;
    font-size: 2rem;
    letter-spacing: 0.04em;
    margin: 0 0 0.3em;
  }
  p { color: #9aa2c0; margin: 0 0 2em; }
  a.link {
    color: #0e101f;
    background: #6fd0ff;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 999px;
    transition: opacity 0.15s ease;
  }
  a.link:hover { opacity: 0.85; }
  footer { margin-top: 3em; color: #565e80; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>LIGHT MERGE</h1>
  <p>A glowing drop-and-merge puzzler by Blubalab.</p>
  <a class="link" href="/privacy/">Privacy Policy</a>
  <footer>&copy; 2026 Blubalab</footer>
</body>
</html>
